<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đảo Đèn Lồng</title>
<style>
  :root{--ui:#F5F1E6;--danger:#FF5A5F;--gold:#F2C14E;--night:#0E1430;--mist:#1B2350}
  html,body{margin:0;height:100%;background:var(--night);overflow:hidden;font-family:system-ui,Segoe UI,sans-serif;color:var(--ui)}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;text-shadow:0 0 6px #000;font-size:18px}
  #flames{top:12px;left:16px;font-size:26px}
  #clock{top:10px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  #clock.low{color:var(--danger);animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #right{top:12px;right:16px;text-align:right;line-height:1.4}
  #score{color:var(--gold);font-weight:700}
  #motes{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  #motes i{width:20px;height:20px;border-radius:50%;border:2px solid #FFE58A55;background:#0006;display:block}
  #motes i.off{display:none}
  #motes i.on{background:radial-gradient(#FFF6C2,#FFE58A);box-shadow:0 0 8px #FFE58A}
  #cds{bottom:14px;right:16px;display:flex;gap:10px}
  .cd{width:64px;height:64px;border-radius:12px;background:#0008;border:2px solid var(--gold);position:relative;text-align:center;font-size:11px;line-height:1.1;overflow:hidden}
  .cd b{display:block;margin:6px 0 2px;font-size:20px}
  .cd .fill{position:absolute;left:0;right:0;bottom:0;background:#000b;height:0}
  #prompt{bottom:96px;left:50%;transform:translateX(-50%);display:none;background:#0009;padding:6px 14px;border-radius:8px;border:1px solid var(--gold)}
  #arrow{position:fixed;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:26px solid var(--gold);display:none;pointer-events:none;filter:drop-shadow(0 0 4px #000)}
  #charm{top:56px;left:16px;color:#C8102E;text-shadow:0 0 6px #000,0 0 2px var(--gold)}
  #windwarn{top:90px;left:50%;transform:translateX(-50%);display:none;color:#8FA3B8}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0E1430ee;text-align:center;padding:20px;box-sizing:border-box}
  .screen.on{display:flex}
  .screen h1{font-size:44px;margin:0 0 8px;color:var(--gold)}
  .screen p{max-width:560px;font-size:18px;line-height:1.5}
  .screen button{font:inherit;font-size:20px;margin:6px;padding:10px 26px;border-radius:10px;border:2px solid var(--gold);background:#1B2350;color:var(--ui);cursor:pointer}
  .screen button:hover{background:#2a3570}
  .screen label{display:block;margin:10px;font-size:18px}
  .small{font-size:14px;opacity:.7}
</style>
</head>
<body>
<div id="flames" class="hud"></div>
<div id="clock" class="hud"></div>
<div id="right" class="hud"><div id="lampcount"></div><div id="score"></div></div>
<div id="charm" class="hud"></div>
<div id="windwarn" class="hud">🍃 Gió sắp nổi!</div>
<div id="capacity" class="hud" style="bottom:46px;left:50%;transform:translateX(-50%);font-size:14px"></div>
<div id="motes" class="hud"></div>
<div id="cds" class="hud">
  <div class="cd" id="cdDash"><b>⚡</b>Lướt<br>Shift<div class="fill"></div></div>
  <div class="cd" id="cdPulse"><b>✦</b>Toả sáng<br>F<div class="fill"></div></div>
</div>
<div id="prompt" class="hud"></div>
<div id="arrow"></div>

<div id="menu" class="screen on">
  <h1>Đảo Đèn Lồng</h1>
  <p>Mây gom đom đóm, thắp lại các Đèn Lồng Lớn và né Bóng Mực qua ba đêm.</p>
  <button id="btnPlay">Chơi</button>
  <button id="btnSettings">Cài đặt</button>
  <p class="small">WASD đi · chuột/←→ xoay · Space nhảy · Shift lướt · E nạp đèn · F toả sáng · Esc/P tạm dừng</p>
</div>
<div id="intro" class="screen"><h1 id="introName"></h1><p id="introText"></p><button id="btnStart">Bắt đầu</button></div>
<div id="pause" class="screen">
  <h1>Tạm dừng</h1>
  <button id="btnResume">Tiếp tục</button><button id="btnRestart">Chơi lại Đêm</button>
  <button id="btnPauseSettings">Cài đặt</button><button id="btnToMenu">Về menu</button>
</div>
<div id="settings" class="screen">
  <h1>Cài đặt</h1>
  <label>Âm lượng <input id="setVol" type="range" min="0" max="100" /></label>
  <label>Độ nhạy chuột <input id="setSens" type="range" min="1" max="100" /></label>
  <label><input id="setCb" type="checkbox" /> Bảng màu dễ phân biệt</label>
  <button id="btnSettingsBack">Quay lại</button>
</div>
<div id="result" class="screen"><h1 id="resTitle"></h1><p id="resText"></p><button id="btnNext"></button><button id="btnResMenu">Về menu</button></div>
<div id="dawn" class="screen"><h1>Bình Minh 🌅</h1><p id="dawnText"></p><button id="btnDawnMenu">Về menu</button></div>
<script type="module" src="/src/web/main.js"></script>
</body>
</html>
